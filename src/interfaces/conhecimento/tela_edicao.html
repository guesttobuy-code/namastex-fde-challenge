<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base de conhecimento — fichas de objeção de preço</title>
<style>
  :root{--bg:#0f1420;--painel:#161d2e;--borda:#26314a;--texto:#e7ecf5;--sutil:#93a1bd;--acento:#4f8cff;--erro:#ff6b6b;--ok:#4fd18b}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--texto)}
  header{padding:16px 24px;border-bottom:1px solid var(--borda);display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:16px;margin:0;font-weight:600}
  header nav a{color:var(--sutil);text-decoration:none;font-size:13px;margin-left:16px}
  main{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:calc(100vh - 57px)}
  aside{border-right:1px solid var(--borda);padding:16px}
  aside button.nova{width:100%;padding:8px;margin-bottom:12px;background:var(--acento);color:#fff;border:none;border-radius:6px;cursor:pointer}
  #lista{list-style:none;margin:0;padding:0}
  #lista li{padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--sutil);font-size:13px}
  #lista li:hover,#lista li.ativa{background:var(--painel);color:var(--texto)}
  #lista li .badge{font-size:11px;padding:1px 6px;border-radius:10px;margin-left:6px}
  .badge.rascunho{background:#3a3220;color:#e0b84f}
  .badge.publicado{background:#173a2a;color:var(--ok)}
  section{padding:24px;max-width:720px}
  label{display:block;font-size:12px;color:var(--sutil);margin:14px 0 4px}
  input,textarea{width:100%;padding:8px;border-radius:6px;border:1px solid var(--borda);background:var(--painel);color:var(--texto);font-family:inherit;font-size:14px}
  textarea{min-height:70px;resize:vertical}
  .ajuda{font-size:11px;color:var(--sutil);margin-top:4px}
  .acoes{margin-top:20px;display:flex;gap:10px}
  button{font-size:14px;padding:9px 16px;border-radius:6px;border:1px solid var(--borda);background:var(--painel);color:var(--texto);cursor:pointer}
  button.primario{background:var(--acento);border-color:var(--acento);color:#fff}
  #mensagem{margin-top:14px;padding:10px 12px;border-radius:6px;font-size:13px;display:none}
  #mensagem.erro{display:block;background:#3a1c1c;color:var(--erro)}
  #mensagem.sucesso{display:block;background:#173a2a;color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>Base de conhecimento — objeções de preço</h1>
  <nav><a href="/painel/index.html">Painel</a></nav>
</header>
<main>
  <aside>
    <button class="nova" id="btn-nova">+ nova ficha</button>
    <ul id="lista"></ul>
  </aside>
  <section>
    <label>Id (usado no arquivo, minúsculas e hífen)</label>
    <input id="campo-id" placeholder="preco-alto">

    <label>Nome da ficha</label>
    <input id="campo-nome" placeholder="Preço tá salgado">

    <label>Frases do lead (uma por linha)</label>
    <textarea id="campo-frases" placeholder="o preço tá salgado&#10;achei caro pra esse carro"></textarea>

    <label>Resposta orientada</label>
    <textarea id="campo-resposta" placeholder="Posso ajustar a franquia para {{franquia}}."></textarea>
    <p class="ajuda">Números só como marcador <code>{{...}}</code> — nunca digitados soltos. A publicação recusa dígito fora de marcador ou marcador desconhecido.</p>

    <label>Argumentos permitidos (um por linha)</label>
    <textarea id="campo-argumentos" placeholder="coberturas&#10;franquia_por_plano"></textarea>

    <label>Tentativas antes do corretor (1 a 5)</label>
    <input id="campo-tentativas" type="number" min="1" max="5" value="2">

    <div class="acoes">
      <button id="btn-rascunho">Salvar rascunho</button>
      <button id="btn-publicar" class="primario">Publicar</button>
    </div>
    <div id="mensagem"></div>
  </section>
</main>
<script>
const lista = document.getElementById('lista');
const mensagem = document.getElementById('mensagem');
const campos = {
  id: document.getElementById('campo-id'),
  nome: document.getElementById('campo-nome'),
  frases: document.getElementById('campo-frases'),
  resposta: document.getElementById('campo-resposta'),
  argumentos: document.getElementById('campo-argumentos'),
  tentativas: document.getElementById('campo-tentativas'),
};

function mostrar(texto, tipo) {
  mensagem.textContent = texto;
  mensagem.className = tipo;
}

function limparFormulario() {
  campos.id.value = '';
  campos.id.disabled = false;
  campos.nome.value = '';
  campos.frases.value = '';
  campos.resposta.value = '';
  campos.argumentos.value = '';
  campos.tentativas.value = 2;
  mensagem.className = '';
}

function preencherFormulario(ficha) {
  campos.id.value = ficha.id;
  campos.id.disabled = true;
  campos.nome.value = ficha.nome || '';
  campos.frases.value = (ficha.frases_do_lead || []).join('\n');
  campos.resposta.value = ficha.resposta_orientada || '';
  campos.argumentos.value = (ficha.argumentos_permitidos || []).join('\n');
  campos.tentativas.value = ficha.tentativas_antes_do_corretor || 2;
  mensagem.className = '';
}

async function carregarLista() {
  const resposta = await fetch('/api/objecoes');
  const fichas = await resposta.json();
  lista.innerHTML = '';
  for (const ficha of fichas) {
    const item = document.createElement('li');
    item.textContent = ficha.nome || ficha.id;
    const selo = document.createElement('span');
    selo.className = 'badge ' + ficha.status;
    selo.textContent = ficha.status;
    item.appendChild(selo);
    item.addEventListener('click', () => preencherFormulario(ficha));
    lista.appendChild(item);
  }
}

async function salvar(status) {
  const dados = {
    id: campos.id.value.trim(),
    nome: campos.nome.value,
    frases_do_lead: campos.frases.value.split('\n').map(l => l.trim()).filter(Boolean),
    resposta_orientada: campos.resposta.value,
    argumentos_permitidos: campos.argumentos.value.split('\n').map(l => l.trim()).filter(Boolean),
    tentativas_antes_do_corretor: Number(campos.tentativas.value),
    status: status,
  };
  if (!dados.id) {
    mostrar('Preencha o id da ficha.', 'erro');
    return;
  }
  const resposta = await fetch('/api/objecoes/' + encodeURIComponent(dados.id), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(dados),
  });
  const corpo = await resposta.json();
  if (!resposta.ok) {
    mostrar(corpo.erro || 'não foi possível salvar', 'erro');
    return;
  }
  mostrar(status === 'publicado' ? 'Publicado.' : 'Rascunho salvo.', 'sucesso');
  preencherFormulario(corpo);
  await carregarLista();
}

document.getElementById('btn-nova').addEventListener('click', limparFormulario);
document.getElementById('btn-rascunho').addEventListener('click', () => salvar('rascunho'));
document.getElementById('btn-publicar').addEventListener('click', () => salvar('publicado'));

carregarLista();
</script>
</body>
</html>
